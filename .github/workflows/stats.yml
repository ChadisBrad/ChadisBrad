name: Refresh stats card

on:
  schedule:
    - cron: "17 19 * * *" # daily at 19:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.config.json"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to the commits the v4 tags pointed at on 19 Nov 2026.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test the generator
        run: node --test scripts/gen-stats.test.mjs

      - name: Build the card
        run: node scripts/gen-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          if git diff --cached --quiet; then
            echo "Card unchanged; nothing to commit."
          else
            git commit -m "chore: refresh stats card"
            git push
          fi
